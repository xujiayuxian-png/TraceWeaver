# dnsmasq config for the web_l4l7 fixture.
#
# Goals:
#   - server.local      → 10.5.0.20 (nginx, valid cert on :443)
#   - tls-broken.local  → 10.5.0.20 (nginx, expired cert on :4443)
#   - ws-flaky.local    → 10.5.0.30 (websocket server)
#   - any other *.local → NXDOMAIN  (this is the trick that produces
#                                    a clean nxdomain pcap; see local=)
#   - any non-.local    → REFUSED   (no upstream resolver configured)
#
# The `local=/local/` directive marks .local as locally-authoritative,
# so dnsmasq returns NXDOMAIN (not REFUSED) for unknown .local names.

# Don't read /etc/resolv.conf / /etc/hosts of the container.
no-resolv
no-hosts

# Bind to all interfaces; container exposes 53/udp on its docker IP.
bind-interfaces
listen-address=0.0.0.0
port=53

# Mark .local as locally authoritative.
local=/local/

# Pinned A records.
address=/server.local/10.5.0.20
address=/tls-broken.local/10.5.0.20
address=/ws-flaky.local/10.5.0.30

# Be talkative in case we need to debug.
log-queries
log-facility=-
