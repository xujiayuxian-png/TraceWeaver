[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "traceweaver"
version = "0.2.0a0"
description = "An LLM-first, pluggable platform for pcap and log analysis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "litellm>=1.40",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
case-memory = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
]
mcp-server = [
    "mcp>=1.0",
]
http-server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
traceweaver = "traceweaver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["traceweaver"]

[tool.pytest.ini_options]
addopts = "-p no:launch -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint"
pythonpath = ["."]
testpaths = ["tests"]
