[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "traceweaver"
version = "0.1.0"
description = "TraceWeaver MVP foundation for 5GC/Open5GS packet analysis"
readme = "plan/5gc-mvp-roadmap.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
traceweaver = "traceweaver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["traceweaver"]

[tool.pytest.ini_options]
addopts = "-p no:launch -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint"
pythonpath = ["."]
testpaths = ["tests"]
