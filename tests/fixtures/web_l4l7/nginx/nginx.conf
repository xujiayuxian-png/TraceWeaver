worker_processes 1;
error_log /var/log/nginx/error.log warn;
events { worker_connections 256; }

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 5;

    # ---- 1. server.local: valid certificate, 443 ----
    server {
        listen 443 ssl;
        server_name server.local;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ---- 2. tls-broken.local: expired certificate, 4443 ----
    server {
        listen 4443 ssl;
        server_name tls-broken.local;
        ssl_certificate     /etc/nginx/certs/expired.crt;
        ssl_certificate_key /etc/nginx/certs/expired.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            return 200 "should-never-reach\n";
            add_header Content-Type text/plain;
        }
    }
}
